<script>
(function(){
const root=document.getElementById('ieg-reader'),$=s=>root.querySelector(s),data=JSON.parse($('#ir-data').textContent),norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const themes=[['temps','Temps de travail',['Astreinte','Tout le thème','Repos','Congés','Horaires']],['argent','Rémunération & frais',['Tout le thème','Repas','Primes','Déplacements']],['carriere','Carrière & formation',['Tout le thème','Classification','Mobilité','Formation']],['sante','Santé & sécurité',['Tout le thème','Maladie','Handicap','Accidents']],['famille','Famille & aidants',['Tout le thème','Enfants','Maternité','Aidants']],['retraite','Retraite',['Tout le thème']],['mandats','Mandats & CSE',['Tout le thème']],['avantages','Avantages sociaux',['Tout le thème']],['regles','Règles & discipline',['Tout le thème']],['autres','À classer',['Tout le thème']]];
let scope='ieg',theme='temps',sub='Astreinte',q='',level='all',selected='d123',limit=5;
function listData(){return data.filter(d=>(scope==='ieg'?d.scope==='ieg':d.scope!=='ieg')).filter(d=>level==='all'||scope==='ieg'||d.level===level).filter(d=>q?norm(d.title+' '+d.ref+' '+d.theme).includes(norm(q)):(d.folder===theme&&(sub==='Tout le thème'||norm(d.title+' '+d.theme).includes(norm(sub).replace(/s$/,''))))).sort((a,b)=>(b.explanation?1:0)-(a.explanation?1:0));}
function preview(d){if(!d){$('#ir-reader').innerHTML='<div class="ir-empty">Sélectionnez un autre thème ou élargissez votre recherche.</div>';return}selected=d.id;const x=d.explanation;$('#ir-reader').innerHTML=`<span class="ir-label ${d.scope==='ieg'?'':'ir-grdf'}">${esc(d.scope==='ieg'?'BRANCHE IEG':d.level==='local'?'GRDF · ÎLE-DE-FRANCE':d.level==='national'?'GRDF · NATIONAL':'GRDF · PÉRIMÈTRE À VÉRIFIER')}</span><h2>${esc(x?x.heading:(d.ref||d.kind))}</h2><p class="ir-title">${esc(d.title)}</p>${x?`<section class="ir-simple"><h3>EN CLAIR</h3><p>${esc(x.simple)}</p></section><h3>Ce que ce texte prévoit</h3><ul>${x.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p class="ir-page">Repères dans le document : ${esc(x.pages)}</p><h3>À rapprocher de</h3><p style="font-size:14px">${esc(x.related)}</p><p class="ir-warning">${esc(x.limit)}</p>`:`<section class="ir-simple"><h3>EXPLICATION À PRÉPARER</h3><p>Ce texte est bien présent dans le corpus. Son contenu doit encore être lu et vérifié avant d’en proposer une explication fiable.</p></section><h3>Identification</h3><p style="font-size:14px">${esc(d.kind)} · ${esc(d.scopeLabel)}</p><p class="ir-warning">${esc(d.note||'La date, le champ d’application et les textes modificatifs restent à contrôler.')}</p>`}${d.url?`<a class="ir-original" target="_blank" rel="noopener noreferrer" href="${esc(d.url)}">Ouvrir le texte original ↗</a>`:'<p class="ir-warning">Original reçu · accès au PDF à intégrer.</p>'}`;}
function draw(){root.querySelectorAll('[data-scope]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scope===scope)));$('#ir-themes').innerHTML=themes.map(t=>`<button data-theme="${t[0]}" aria-pressed="${theme===t[0]&&!q}">${t[1]}</button>`).join('');$('#ir-theme-title').textContent=q?'Résultats de recherche':sub==='Tout le thème'?themes.find(t=>t[0]===theme)[1]:sub;$('#ir-level').hidden=scope==='ieg';$('#ir-level').value=level;const a=listData();let d=a.find(d=>d.id===selected)||a[0];if(d)selected=d.id;$('#ir-list').innerHTML=`<div class="ir-list-head">${a.length} texte${a.length>1?'s':''} · ${scope==='ieg'?'branche IEG':'GRDF'}</div>`+(a.length?a.slice(0,limit).map(d=>`<button class="ir-doc" data-doc="${d.id}" aria-pressed="${selected===d.id}"><span class="ir-ref">${esc(d.ref||d.kind)}</span><strong>${esc(d.explanation?d.explanation.heading:d.title)}</strong><small>${esc(d.scope==='ieg'?'Branche IEG':d.level==='local'?'GRDF · Île-de-France':d.level==='national'?'GRDF · National':'GRDF · périmètre à vérifier')}${d.explanation?' · Explication disponible':''}</small></button>`).join(''):'<div class="ir-empty">Aucun texte pour cette sélection.</div>')+(a.length>limit?'<button class="ir-more" data-more>Voir plus de textes ↓</button>':'');preview(d);}
function setTheme(id){theme=id;sub=themes.find(t=>t[0]===id)[2][0];q='';$('#ir-q').value='';$('#ir-sub').innerHTML=themes.find(t=>t[0]===id)[2].map(s=>`<option>${esc(s)}</option>`).join('');$('#ir-question-result').hidden=true;limit=5;draw()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scope){scope=b.dataset.scope;level='all';limit=5;draw()}if(b.dataset.theme)setTheme(b.dataset.theme);if(b.dataset.doc){selected=b.dataset.doc;preview(data.find(d=>d.id===selected));root.querySelectorAll('[data-doc]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.doc===selected)))}if(b.hasAttribute('data-more')){limit+=10;draw()}});
$('#ir-sub').addEventListener('change',e=>{sub=e.target.value;q='';limit=5;$('#ir-q').value='';$('#ir-question-result').hidden=true;draw()});$('#ir-level').addEventListener('change',e=>{level=e.target.value;draw()});$('#ir-search').addEventListener('submit',e=>{e.preventDefault();const input=$('#ir-q').value.trim();const n=norm(input);q=/astreinte|rtt/.test(n)?'astreinte':/repas|manger/.test(n)?'repas':/enfant/.test(n)?'enfant':input;limit=5;const p=$('#ir-question-result');p.hidden=!q;p.textContent='Recherche dans '+(scope==='ieg'?'les textes de branche':'les textes GRDF')+' : « '+q+' ». Vous pouvez changer de corpus avec les deux boutons ci-dessus.';draw()});setTheme('temps');
})();
</script>
