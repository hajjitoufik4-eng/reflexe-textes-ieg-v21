<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réflexe IEG — Projet 1</title>
<style>
:root{font-family:Arial,sans-serif;color:#20304d;background:#f4f6fb;line-height:1.65}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #3558da;outline-offset:4px}button{color:inherit}header{background:white;border-bottom:1px solid #dfe5ef;padding:22px max(24px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:23px;font-weight:700;letter-spacing:-1px;border:0;background:none;padding:0}.brand span{color:#3558da}.project{font-size:13px;color:#65738b}main{max-width:1120px;margin:auto;padding:52px 24px 72px}h1{font-size:clamp(28px,4vw,44px);line-height:1.2;letter-spacing:-1.5px;font-weight:600;max-width:830px;margin:16px 0}h2{font-size:25px;font-weight:500;line-height:1.4;margin:0 0 14px}p{margin:12px 0}.muted{color:#65738b}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-size:12px;color:#3558da}.search{display:flex;gap:12px;background:white;border:1px solid #d6deec;padding:10px;border-radius:10px;margin:28px 0 45px}.search input{border:0;min-width:0;flex:1;padding:10px;font-size:17px;background:transparent}.primary{background:#274ac4;color:white;border:0;padding:12px 22px;border-radius:7px}.corpora{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:28px}.corpus{text-align:left;background:white;border:1px solid #dce3ef;border-radius:12px;padding:34px;min-height:210px}.corpus:hover{border-color:#3558da;box-shadow:0 9px 24px #20304d09}.stamp{display:inline-block;padding:5px 10px;background:#edf1ff;color:#274ac4;font-size:12px;border-radius:4px;letter-spacing:.5px}.grdf{background:#fff1e4;color:#945310}.corpus h2{margin:20px 0 12px}.corpus p{font-size:15px;color:#65738b}.arrow{display:block;margin-top:24px;color:#274ac4;font-size:14px}.back{border:0;background:transparent;color:#274ac4;padding:0 0 20px;font-size:14px}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}.theme{background:white;border:1px solid #dce3ef;text-align:left;padding:25px;border-radius:10px}.theme strong{display:block;font-size:18px;font-weight:500}.theme small{display:block;color:#65738b;font-size:13px;margin-top:10px}.theme:hover{border-color:#3558da}.crumb{font-size:13px;color:#65738b;margin-bottom:24px}.row{display:block;width:100%;text-align:left;background:white;border:1px solid #dce3ef;border-radius:10px;padding:25px 28px;margin:17px 0}.row strong{display:block;font-size:19px;font-weight:500;line-height:1.5;margin:12px 0}.row small{font-size:13px;color:#65738b}.reader{background:white;border:1px solid #dce3ef;border-radius:12px;padding:42px;margin-top:30px}.reader h2{font-size:27px}.reader h3{margin-top:32px;font-size:19px;font-weight:500}.simple{background:#f0f4ff;border-left:3px solid #3558da;padding:25px 28px;margin:28px 0;font-size:18px;line-height:1.8}.reader li{margin:14px 0;font-size:17px;line-height:1.8}.tabs{display:flex;gap:30px;border-bottom:1px solid #dce3ef;margin:26px 0 30px;flex-wrap:wrap}.tabs button{background:none;border:0;padding:13px 0;border-bottom:3px solid transparent}.tabs button[aria-pressed=true]{color:#274ac4;border-color:#274ac4}.source{display:inline-block;border:1px solid #dce3ef;color:#274ac4;border-radius:6px;padding:10px 15px;text-decoration:none;margin:8px 10px 18px 0}.pdf{width:100%;height:820px;border:1px solid #dce3ef}.notice{font-size:13px;color:#65738b;border-top:1px solid #dce3ef;padding-top:18px;margin-top:28px}.empty{padding:28px;border:1px dashed #cad8d2;border-radius:10px}footer{max-width:1120px;margin:auto;padding:20px 24px;border-top:1px solid #dce3ef;font-size:12px;color:#65738b}.levels{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.levels button{border:1px solid #dce3ef;border-radius:7px;background:white;padding:9px 14px;font-size:14px}.levels button[aria-pressed=true]{background:#274ac4;color:white}.more{border:0;background:none;color:#274ac4;padding:15px 0}.error{color:#8a352d}[hidden]{display:none!important}
@media(max-width:700px){main{padding:32px 18px 45px}.corpora,.themes{grid-template-columns:1fr}.corpus{padding:28px;min-height:0}.reader{padding:24px 20px}.search{flex-wrap:wrap;margin-bottom:30px}.search input{flex-basis:100%;width:100%}.primary{width:100%}.pdf{height:560px}.row{padding:22px}.project{font-size:11px}}
.document-title{color:#20304d;text-decoration:none}.document-title:hover{color:#274ac4;text-decoration:underline}.doc-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0 8px}.doc-actions .source{margin:0;font-size:14px;background:#edf1ff;color:#274ac4}.doc-actions .explanation-button{background:white}.brand>span:first-child{display:inline-block;background:#edf1ff;border-radius:8px;padding:3px 8px;margin-right:7px}</style></head><body><header><button class="brand" data-home><span aria-hidden="true">⚖️</span> Réflexe <span>IEG</span></button><span class="project">Projet 1 · version de travail</span></header><main id="app" aria-live="polite"><p>Chargement du corpus…</p></main><footer>Textes de branche et textes GRDF séparés · Applicabilité à vérifier · Recherche par intitulé, IA non connectée.</footer>
<script>
(async()=>{
const app=document.getElementById('app'),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let data=[],scope='',theme='',query='',selected=null,tab='simple',level='all',limit=12;
const topics=[['temps','Temps de travail','Astreinte, repos, horaires et congés'],['argent','Rémunération et frais','Primes, repas et déplacements'],['carriere','Carrière et formation','Classification, mobilité et parcours'],['sante','Santé et sécurité','Maladie, accidents et handicap'],['famille','Famille et aidants','Enfants, parentalité et absences'],['retraite','Retraite','Pensions et départ en inactivité'],['mandats','Mandats et représentation','CSE, CSP et droit syndical'],['avantages','Avantages sociaux','Tarif agent et activités sociales'],['regles','Règles et discipline','Statut et règles internes'],['autres','Autres références','Documents restant à classer']];
const name=()=>scope==='ieg'?'Branche IEG':'GRDF';
const tag=d=>d.scope==='ieg'?'Branche IEG':d.level==='local'?'GRDF · régional / local':d.level==='national'?'GRDF · national':'GRDF · périmètre à vérifier';
function pdf(d){if(!d.url)return '';if(d.url.startsWith('https://github.com/hajjitoufik4-eng/reflexe-textes-ieg-v21/blob/'))return '../'+d.url.split('/blob/')[1].split('/').slice(1).join('/');return d.url}
function searchForm(){return '<form class="search"><input aria-label="Votre question" placeholder="Posez votre question avec vos mots…" value="'+esc(query)+'"><button class="primary">Trouver les textes →</button></form>'}
function home(){scope='';theme='';selected=null;query='';app.innerHTML='<div class="eyebrow">Vos droits, plus simplement</div><h1>Par où souhaitez-vous commencer ?</h1><p class="muted">Choisissez votre corpus. Chaque texte dispose de sa propre fiche de lecture.</p><div class="corpora"><button class="corpus" data-scope="ieg"><span class="stamp">BRANCHE IEG</span><h2>Le cadre de la branche</h2><p>PERS, accords de branche et circulaires issus du corpus IEG.</p><span class="arrow">Explorer les textes de branche ↗</span></button><button class="corpus" data-scope="grdf"><span class="stamp grdf">GRDF</span><h2>Les textes de l’entreprise</h2><p>Accords et notes GRDF, en distinguant le national du régional et du local.</p><span class="arrow">Explorer les textes GRDF ↗</span></button></div>'}
function render(){
if(!scope){home();return}
let out='<button class="back" data-home>← Choisir un autre corpus</button><div class="crumb">'+name()+(theme?' / '+topics.find(t=>t[0]===theme)[1]:'')+'</div>';
if(selected){const d=data.find(d=>d.id===selected),x=d.explanation,u=pdf(d);out='<button class="back" data-back>← Retour aux textes</button><div class="crumb">'+name()+' / Fiche du texte</div><span class="stamp '+(scope==='grdf'?'grdf':'')+'">'+esc(tag(d))+'</span><h1>'+esc(x?x.heading:d.ref||d.kind)+'</h1><p class="muted">'+esc(d.title)+'</p><section class="reader"><div class="tabs"><button data-tab="simple" aria-pressed="'+(tab==='simple')+'">Explication simple</button><button data-tab="original" aria-pressed="'+(tab==='original')+'">Document original</button></div>';
if(tab==='simple'){out+=x?'<h2>Ce qu’il faut comprendre</h2><div class="simple">'+esc(x.simple)+'</div><h3>Ce que prévoit le texte</h3><ul>'+x.points.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul><p class="muted">Dans le document : '+esc(x.pages)+'</p><h3>Textes à rapprocher</h3><p>'+esc(x.related)+'</p><p class="notice">'+esc(x.limit)+'</p>':'<h2>Explication en préparation</h2><p>Ce document est recensé. Son contenu doit encore être lu et vérifié pour vous proposer une explication fiable.</p><p class="notice">'+esc(d.note||'Périmètre, dates et textes modificatifs à contrôler.')+'</p>'}
else out+=u?'<h2>Le texte original</h2><a class="source" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Ouvrir le PDF ↗</a><a class="source" href="'+esc(u)+'" download>Télécharger</a><object class="pdf" type="application/pdf" data="'+esc(u)+'" aria-label="Texte original"><p>Votre navigateur ne peut pas afficher le PDF ici. Utilisez le lien d’ouverture.</p></object>':'<h2>PDF à intégrer</h2><p>L’original figure dans la collecte, mais son accès depuis cette fiche reste à terminer.</p>';
app.innerHTML=out+'</section>';return}
out+='<div class="eyebrow">'+name()+'</div><h1>'+esc(theme?topics.find(t=>t[0]===theme)[1]:'Trouvez le texte qui vous concerne.')+'</h1>'+searchForm();
if(scope==='grdf')out+='<div class="levels">'+[['all','Tous les textes GRDF'],['national','National confirmé'],['local','Régional / local'],['unverified','Périmètre à vérifier']].map(x=>'<button data-level="'+x[0]+'" aria-pressed="'+(level===x[0])+'">'+x[1]+'</button>').join('')+'</div>';
if(!theme&&!query){out+='<div class="themes">'+topics.map(t=>'<button class="theme" data-theme="'+t[0]+'"><strong>'+t[1]+'</strong><small>'+t[2]+'</small></button>').join('')+'</div>'}
else{const n=norm(query),term=/rtt|astreinte/.test(n)?'astreinte':/repas|manger/.test(n)?'repas':n;const list=data.filter(d=>(scope==='ieg'?d.scope==='ieg':d.scope!=='ieg')&&(scope==='ieg'||level==='all'||d.level===level)&&(!theme||d.folder===theme)&&(!term||norm(d.title+' '+d.ref+' '+d.theme).includes(term))).sort((a,b)=>Number(!!b.explanation)-Number(!!a.explanation));
out+='<button class="back" data-themes>← Tous les thèmes</button><p class="muted">'+list.length+' références dans cette sélection</p>'+list.slice(0,limit).map(d=>'<article class="row"><span class="stamp '+(scope==='grdf'?'grdf':'')+'">'+esc(tag(d))+'</span><strong>'+(pdf(d)?'<a class="document-title" href="'+esc(pdf(d))+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc('Ouvrir le PDF : '+d.title)+'">'+esc(d.title)+' ↗</a>':esc(d.title))+'</strong><div class="doc-actions">'+(pdf(d)?'<a class="source" href="'+esc(pdf(d))+'" target="_blank" rel="noopener noreferrer">Ouvrir le texte ↗</a>':'<small>PDF à intégrer</small>')+'<button class="source explanation-button" data-doc="'+d.id+'">'+(d.explanation?'Lire l’explication':'Voir la fiche')+'</button></div><small>'+(d.explanation?'Explication disponible':'Explication à préparer')+'</small></article>').join('');if(!list.length)out+='<p class="empty">Aucun intitulé correspondant. Essayez un mot plus simple ou un autre thème.</p>';if(list.length>limit)out+='<button class="more" data-more>Afficher davantage de textes ↓</button>'}
app.innerHTML=out}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-home')){home();return}if(b.dataset.scope){scope=b.dataset.scope;theme='';level='all';query=''}if(b.dataset.theme){theme=b.dataset.theme;limit=12}if(b.dataset.level){level=b.dataset.level;limit=12}if(b.dataset.doc){selected=b.dataset.doc;tab='simple'}if(b.dataset.tab)tab=b.dataset.tab;if(b.hasAttribute('data-back'))selected=null;if(b.hasAttribute('data-themes')){theme='';query=''}if(b.hasAttribute('data-more'))limit+=12;render()});
app.addEventListener('submit',e=>{e.preventDefault();query=e.target.querySelector('input').value.trim();theme='';limit=12;render()});
try{const r=await fetch('./lecture-textes.html');if(!r.ok)throw Error();const doc=new DOMParser().parseFromString(await r.text(),'text/html');data=JSON.parse(doc.getElementById('ir-data').textContent);home()}catch(e){app.innerHTML='<h1>Le corpus ne se charge pas.</h1><p>Rechargez la page ou consultez la version précédente.</p><a class="source" href="./lecture-textes.html">Ouvrir les textes</a>'}
})();
</script></body></html>
