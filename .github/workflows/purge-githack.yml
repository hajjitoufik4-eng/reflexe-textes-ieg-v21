name: Purge RawGitHack cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/purge-githack.yml"
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge cached test URLs
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://rawcdn.githack.com/hajjitoufik4-eng/reflexe-textes-ieg-v21/7e3d467859c319b548a01ab883ebfabd7cf40268/validation-intuitive.html"
            "https://rawcdn.githack.com/hajjitoufik4-eng/reflexe-textes-ieg-v21/2570887339e55b8dea35255229e574baede897e0/validation-testeurs.html"
            "https://rawcdn.githack.com/hajjitoufik4-eng/reflexe-textes-ieg-v21/45624c978f5857be5d0ec2bd2aa2ba333c0d6f01/validation-testeurs.html"
            "https://rawcdn.githack.com/hajjitoufik4-eng/reflexe-textes-ieg-v21/42a8853039910d5632f9f47884c62c82116cadc5/validation-testeurs.html"
          )
          for u in "${urls[@]}"; do
            echo "Purging $u"
            curl --fail-with-body -sS -X DELETE --get --data-urlencode "url=$u" "https://raw.githack.com/purge"
            echo
          done
